name: Ultra Release — Build and Push Docker Images

on:
  push:
    branches: [ultra/main]
  workflow_dispatch:

env:
  BUILD_PLATFORMS: linux/amd64 #,linux/arm64
  DOCKER_REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: builder
            image: chatbotx-builder
            dockerfile: ./apps/builder/docker/Dockerfile
          - label: worker
            image: chatbotx-worker
            dockerfile: ./apps/worker/docker/Dockerfile
          - label: realtime
            image: chatbotx-realtime
            dockerfile: ./apps/realtime/docker/Dockerfile
          - label: mcp-server
            image: chatbotx-mcp
            dockerfile: ./apps/mcp-server/docker/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image namespace (GHCR requires lowercase)
        id: image_namespace
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set short SHA tag
        id: short_sha
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set built-at timestamp
        id: built_at
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ steps.image_namespace.outputs.owner_lc }}/${{ matrix.image }}:ultra
            ${{ env.DOCKER_REGISTRY }}/${{ steps.image_namespace.outputs.owner_lc }}/${{ matrix.image }}:ultra-${{ steps.short_sha.outputs.sha7 }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.label }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: |
            ULTRA_FORK_SHA=${{ github.sha }}
            ULTRA_BUILT_AT=${{ steps.built_at.outputs.iso }}
